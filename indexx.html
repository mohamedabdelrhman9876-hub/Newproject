<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevStart Rwanda</title>
</head>
<body>

    <h1>DevStart Rwanda - Student Enrollment Form</h1>
    <p>Please fill in the form below to register for the Software Development course.</p>

    <hr>

    <h2>1. Enrollment Form</h2>

    <form>
        <label>Full Name:</label><br>
        <input type="text" placeholder="full name"><br><br>

        <label>Email Address:</label><br>
        <input type="email" placeholder="you@example.com"><br><br>

        <label>Phone Number:</label><br>
        <input type="text" placeholder="07XX XXX XXX"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Prefer not to say<br><br>

        <label>Track You Are Interested In:</label><br>
        <select>
            <option>-- Select a track --</option>
        </select><br><br>

        <label>Preferred Learning Days:</label><br>
        <select>
            <option>Weekdays</option>
        </select><br><br>

        <label>Skills You Already Know:</label><br>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <input type="checkbox"> Git
        <input type="checkbox"> None yet<br><br>

        <label>Self-Rated Experience Level (0-100):</label><br>
        <input type="range" min="0" max="100" value="10"><br><br>

        <label>Pick a Profile Tag Colour:</label><br>
        <input type="color" value="#2d7d73"><br><br>

        <label>Upload Your CV (PDF):</label><br>
        <input type="file"><br><br>

      
    </form>

</body>
</html>
